# Publishes the website in site/ to GitHub Pages: https://fcoltro.github.io/SimpleDeFence/
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The logo and screenshots are copied in from SimpleDeFence.Assets, so the README and the site
# always show the same pictures.
name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'SimpleDeFence.Assets/simpledefence.png'
      - 'SimpleDeFence.Assets/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Assemble the site
      run: |
        mkdir -p _site/assets
        cp -r site/. _site/
        cp SimpleDeFence.Assets/simpledefence.png _site/assets/
        cp SimpleDeFence.Assets/screenshots/connections-light.png SimpleDeFence.Assets/screenshots/connections-dark.png _site/assets/
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
